<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phim TV - Android TV Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #0f0f0f;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        body {
            font-size: 18px;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%);
            display: flex;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 2px;
        }

        .nav-menu {
            display: flex;
            gap: 40px;
            margin-left: 60px;
        }
        
        .nav-item {
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 4px;
            transition: all 0.2s;
            outline: none;
        }

        .nav-item:focus {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .nav-item.active {
            font-weight: bold;
            color: #e50914;
        }

        /* Main Content */
        .main-content {
            padding-top: 100px;
            padding-bottom: 60px;
        }

        /* Section */
        .section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin-left: 40px;
            margin-bottom: 20px;
            color: #e5e5e5;
        }

        /* Movie Row */
        .movie-row {
            display: flex;
            gap: 20px;
            padding: 20px 40px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        .movie-row::-webkit-scrollbar {
            display: none;
        }

        /* Movie Item */
        .movie-item {
            flex: 0 0 auto;
            width: 280px;
            height: 420px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            background: #1a1a1a;
        }

        .movie-item:focus {
            transform: scale(1.1);
            box-shadow: 0 0 0 4px #fff, 0 0 20px rgba(255,255,255,0.5);
            z-index: 10;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            opacity: 1;
            transition: opacity 0.3s;
        }

        .movie-item:focus .movie-info {
            display: none;
        }

        .movie-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .movie-meta {
            font-size: 14px;
            color: #a3a3a3;
        }

        .movie-quality {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e50914;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 20px;
            color: #a3a3a3;
        }

        /* Modal Player */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            width: 95%;
            height: 95%;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: #e50914;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .modal-close:focus {
            transform: scale(1.1);
            box-shadow: 0 0 0 3px #fff;
        }

        /* Custom Video Player for TV Box */
        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            padding: 30px;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .control-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .control-btn {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 2px solid transparent;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            min-width: 100px;
        }

        .control-btn:focus {
            background: #e50914;
            border-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }

        .time-display {
            font-size: 20px;
            color: #fff;
            font-weight: bold;
            min-width: 150px;
            text-align: center;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: #e50914;
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .control-hint {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            text-align: center;
        }

        .volume-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .volume-indicator.show {
            opacity: 1;
        }

        /* Resume notification */
        .resume-notification {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(229, 9, 20, 0.95);
            color: #fff;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            z-index: 200;
            animation: fadeInOut 5s ease-in-out;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .resume-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            10% { opacity: 1; transform: translateX(-50%) translateY(0); }
            90% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Video player focus state */
        .video-player:focus {
            outline: none;
        }

        /* Error message */
        .error-message {
            text-align: center;
            padding: 40px;
            color: #e50914;
            font-size: 18px;
        }

        /* Search Box */
        .search-container {
            position: fixed;
            top: 20px;
            right: 40px;
            z-index: 101;
        }

        .search-input {
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            color: #fff;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            width: 300px;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            background: rgba(255,255,255,0.2);
            border-color: #e50914;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
        }

        .search-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* Movie Details Popup */
        .movie-details {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            padding: 20px;
            border-radius: 8px 8px 0 0;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 20;
            min-height: 150px;
        }

        .movie-item:focus .movie-details {
            opacity: 1;
            transform: translateY(0);
        }

        .movie-details-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }

        .movie-details-meta {
            font-size: 14px;
            color: #a3a3a3;
            margin-bottom: 10px;
        }

        .movie-details-desc {
            font-size: 14px;
            color: #ccc;
            line-height: 1.5;
            display: -webkit-box;
            display: box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            box-orient: vertical;
            overflow: hidden;
        }

        /* Continue Watching Badge */
        .continue-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: #e50914;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            z-index: 5;
        }

        .progress-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255,255,255,0.3);
        }

        .progress-indicator-bar {
            height: 100%;
            background: #e50914;
            transition: width 0.3s;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Load More Button */
        .load-more-container {
            text-align: center;
            padding: 40px;
        }

        .load-more-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .load-more-btn:focus {
            transform: scale(1.05);
            box-shadow: 0 0 0 3px #fff, 0 0 20px rgba(229, 9, 20, 0.5);
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px;
            font-size: 20px;
            color: #a3a3a3;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">PHIM TV</div>
        <nav class="nav-menu">
            <div class="nav-item active" tabindex="0" data-section="movies">Phim Mới</div>
            <div class="nav-item" tabindex="0" data-section="series">Phim Bộ</div>
        </nav>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Tìm phim... (S)" tabindex="0">
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="loading">Đang tải phim...</div>
    </main>

    <!-- Modal Player -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" tabindex="0" id="modalClose">Thoát (Back)</button>
            <div class="video-container">
                <video class="video-player" id="videoPlayer" tabindex="0" playsinline></video>
                <div class="video-controls" id="videoControls">
                    <div class="control-bar">
                        <button class="control-btn" id="playPauseBtn" tabindex="0">⏵ Play</button>
                        <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
                        <button class="control-btn" id="seekBackBtn" tabindex="0">⏪ -10s</button>
                        <button class="control-btn" id="seekForwardBtn" tabindex="0">⏩ +10s</button>
                        <button class="control-btn" id="fullscreenBtn" tabindex="0">⛶ Full</button>
                    </div>
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="volume-indicator" id="volumeIndicator">Âm lượng: 100%</div>
                    <div class="control-hint">
                        OK/Enter: Play/Pause | ← →: Tua 10s | ↑ ↓: Âm lượng | F: Toàn màn hình | Back: Thoát
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- HLS.js for m3u8 support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>

    <script>
        // API Configuration
        const API_BASE = 'https://ophim1.com';
        
        // State
        let movies = [];
        let focusedElement = null;
        let currentSection = 'movies';
        let currentMovieSlug = null;
        let currentEpisodeId = null;
        let currentPage = 1;
        let isSearching = false;
        let searchQuery = '';
        let allMovies = []; // Store all loaded movies for search
        const focusableSelectors = '.nav-item, .movie-item, .modal-close, .search-input, .load-more-btn';
        
        // Resume playback storage key
        const STORAGE_KEY = 'phimTV_watchProgress';
        const CONTINUE_WATCHING_KEY = 'phimTV_continueWatching';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadMovies();
            setupNavigation();
            setupSearch();
        });

        // Load Movies from API with pagination
        async function loadMovies(page = 1, append = false) {
            const mainContent = document.getElementById('mainContent');
            
            if (!append) {
                mainContent.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>Đang tải phim...</p></div>';
            }
            
            try {
                const url = isSearching && searchQuery 
                    ? `${API_BASE}/tim-kiem?q=${encodeURIComponent(searchQuery)}&page=${page}`
                    : `${API_BASE}/danh-sach/phim-moi-cap-nhat?page=${page}`;
                    
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === true && data.items && Array.isArray(data.items)) {
                    const pathImage = data.pathImage || 'https://img.ophim.live/uploads/movies/';
                    
                    if (append) {
                        movies = [...movies, ...data.items];
                        allMovies = [...allMovies, ...data.items];
                        appendMovies(data.items, pathImage);
                    } else {
                        movies = data.items;
                        allMovies = data.items;
                        currentPage = page;
                        renderMoviesWithSections(movies, pathImage);
                    }
                    
                    // Set initial focus
                    setTimeout(() => {
                        const firstNav = document.querySelector('.nav-item');
                        if (firstNav) firstNav.focus();
                    }, 100);
                } else if (isSearching) {
                    // Search returned no results
                    if (!append) {
                        mainContent.innerHTML = 
                            `<div class="error-message">Không tìm thấy kết quả cho "${searchQuery}". <button tabindex="0" onclick="clearSearch()">Xóa tìm kiếm</button></div>`;
                    }
                } else {
                    throw new Error('Invalid data format');
                }
            } catch (error) {
                if (!append) {
                    if (isSearching) {
                        mainContent.innerHTML = 
                            `<div class="error-message">Lỗi tìm kiếm. <button tabindex="0" onclick="clearSearch()">Xóa tìm kiếm</button></div>`;
                    } else {
                        mainContent.innerHTML = 
                            `<div class="error-message">Lỗi tải phim: ${error.message}. <button tabindex="0" onclick="loadMovies()">Thử lại</button></div>`;
                    }
                }
            }
        }

        // Clear search and load default movies
        function clearSearch() {
            isSearching = false;
            searchQuery = '';
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = '';
            loadMovies(1, false);
        }

        // Get continue watching list
        function getContinueWatching() {
            try {
                const progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                const watching = [];
                
                for (const [key, value] of Object.entries(progress)) {
                    // Only include if watched between 1% and 95% and within last 30 days
                    if (value.duration > 0) {
                        const percent = (value.currentTime / value.duration) * 100;
                        const daysAgo = (Date.now() - (value.timestamp || Date.now())) / (1000 * 60 * 60 * 24);
                        
                        if (percent > 1 && percent < 95 && daysAgo < 30) {
                            // Use data from localStorage instead of searching in allMovies
                            watching.push({
                                slug: value.slug || key,
                                name: value.name || 'Unknown',
                                poster_url: value.poster_url || '',
                                year: value.year || '',
                                time: value.time || '',
                                lang: value.lang || '',
                                episode_current: value.episode_current || '',
                                content: value.content || '',
                                progress: percent,
                                currentTime: value.currentTime,
                                duration: value.duration
                            });
                        }
                    }
                }
                
                // Sort by most recently watched
                return watching.sort((a, b) => b.timestamp - a.timestamp).slice(0, 10);
            } catch (e) {
                return [];
            }
        }

        // Render movie card HTML
        function renderMovieCard(movie, index, pathImage) {
            const progress = movie.progress || 0;
            const hasProgress = progress > 0 && progress < 95;
            
            return `
                <div class="movie-item" tabindex="0" data-movie-index="${index}" data-slug="${movie.slug}">
                    <img class="movie-poster" 
                         src="${movie.poster_url ? pathImage + movie.poster_url : movie.thumb_url ? pathImage + movie.thumb_url : 'https://via.placeholder.com/280x420?text=No+Image'}" 
                         alt="${movie.name}" 
                         loading="lazy"
                         onerror="this.src='https://via.placeholder.com/280x420?text=No+Image'">
                    ${movie.quality ? `<span class="movie-quality">${movie.quality}</span>` : ''}
                    ${hasProgress ? `
                        <div class="continue-badge">Tiếp tục ${Math.round(progress)}%</div>
                        <div class="progress-indicator">
                            <div class="progress-indicator-bar" style="width: ${progress}%"></div>
                        </div>
                    ` : ''}
                    <div class="movie-details" aria-hidden="true">
                        <div class="movie-details-title">${movie.name}</div>
                        <div class="movie-details-meta">
                            ${movie.year || ''} ${movie.time ? '• ' + movie.time : ''} 
                            ${movie.lang ? '• ' + movie.lang : ''}
                            ${movie.episode_current ? '• ' + movie.episode_current : ''}
                        </div>
                        <div class="movie-details-desc">${movie.content || 'Không có mô tả'}</div>
                    </div>
                </div>
            `;
        }

        // Render movies with sections (Continue Watching + New Movies)
        function renderMoviesWithSections(moviesList, pathImage) {
            const mainContent = document.getElementById('mainContent');
            const continueWatching = getContinueWatching();
            
            let html = '';
            
            // Continue Watching Section
            if (continueWatching.length > 0) {
                html += `
                    <section class="section">
                        <h2 class="section-title">Tiếp Tục Xem</h2>
                        <div class="movie-row" id="continueRow">
                            ${continueWatching.map((movie, index) => renderMovieCard(movie, index, pathImage)).join('')}
                        </div>
                    </section>
                `;
            }
            
            // New Movies Section - Filter out movies already in continue watching
            const continueWatchingSlugs = new Set(continueWatching.map(m => m.slug));
            const filteredMovies = moviesList.filter(movie => !continueWatchingSlugs.has(movie.slug));
            
            html += `
                <section class="section">
                    <h2 class="section-title">${isSearching ? `Kết quả tìm kiếm: "${searchQuery}"` : 'Phim Mới Cập Nhật'}</h2>
                    <div class="movie-row" id="movieRow">
                        ${filteredMovies.map((movie, index) => renderMovieCard(movie, index, pathImage)).join('')}
                    </div>
                    ${!isSearching ? `
                        <div class="load-more-container">
                            <button class="load-more-btn" id="loadMoreBtn" tabindex="0">Tải thêm phim</button>
                        </div>
                    ` : ''}
                </section>
            `;
            
            mainContent.innerHTML = html;
            
            // Add event handlers
            addMovieEventHandlers();
            
            // Load more button handler
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (loadMoreBtn) {
                loadMoreBtn.addEventListener('click', () => loadMoreMovies());
                loadMoreBtn.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        loadMoreMovies();
                    }
                });
            }
        }

        // Append more movies to existing list
        function appendMovies(newMovies, pathImage) {
            const movieRow = document.getElementById('movieRow');
            
            // Filter out movies already in continue watching
            const continueWatching = getContinueWatching();
            const continueWatchingSlugs = new Set(continueWatching.map(m => m.slug));
            const filteredNewMovies = newMovies.filter(movie => !continueWatchingSlugs.has(movie.slug));
            
            if (filteredNewMovies.length === 0) return;
            
            const startIndex = movies.length - filteredNewMovies.length;
            
            const newHtml = filteredNewMovies.map((movie, index) => 
                renderMovieCard(movie, startIndex + index, pathImage)
            ).join('');
            
            movieRow.insertAdjacentHTML('beforeend', newHtml);
            
            // Add event handlers for new items
            addMovieEventHandlers();
        }

        // Add event handlers to movie items
        function addMovieEventHandlers() {
            document.querySelectorAll('.movie-item').forEach(item => {
                item.addEventListener('click', () => playMovie(item.dataset.slug));
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        playMovie(item.dataset.slug);
                    }
                });
            });
        }

        // Load more movies
        async function loadMoreMovies() {
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (loadMoreBtn) {
                loadMoreBtn.innerHTML = '<div class="loading-spinner" style="width: 20px; height: 20px; border-width: 2px;"></div> Đang tải...';
                loadMoreBtn.disabled = true;
            }
            
            await loadMovies(currentPage + 1, true);
            currentPage++;
            
            if (loadMoreBtn) {
                loadMoreBtn.innerHTML = 'Tải thêm phim';
                loadMoreBtn.disabled = false;
            }
        }

        // Setup search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('focus', () => {
                searchInput.select();
            });
            
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const query = searchInput.value.trim();
                    if (query) {
                        isSearching = true;
                        searchQuery = query;
                        loadMovies(1, false);
                    } else {
                        isSearching = false;
                        searchQuery = '';
                        loadMovies(1, false);
                    }
                } else if (e.key === 'Escape') {
                    searchInput.blur();
                    const firstNav = document.querySelector('.nav-item');
                    if (firstNav) firstNav.focus();
                }
            });
        }

        // Play Movie - Open Modal with video URL
        async function playMovie(slug) {
            try {
                const response = await fetch(`${API_BASE}/phim/${slug}`);
                const data = await response.json();
                
                if (data.status === true && data.episodes && Array.isArray(data.episodes)) {
                    const episodes = data.episodes;
                    let videoUrl = null;
                    let episodeId = null;
                    
                    // Find first available video URL (prefer m3u8 over embed)
                    for (const server of episodes) {
                        if (server.server_data && server.server_data.length > 0) {
                            const firstEp = server.server_data[0];
                            // Prefer m3u8 for native player, fallback to embed
                            videoUrl = firstEp.link_m3u8 || firstEp.link_embed;
                            episodeId = firstEp.slug || 'ep1';
                            if (videoUrl) break;
                        }
                    }
                    
                    if (videoUrl) {
                        currentMovieSlug = slug;
                        currentEpisodeId = episodeId;
                        openModal(videoUrl, data.movie?.name || 'Phim', slug, episodeId);
                    } else {
                        alert('Không tìm thấy link phim!');
                    }
                } else {
                    alert('Không thể tải thông tin phim!');
                }
            } catch (error) {
                alert('Lỗi: ' + error.message);
            }
        }

        // Save watch progress to localStorage
        function saveWatchProgress(slug, episodeId, currentTime, duration) {
            try {
                const progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                progress[`${slug}_${episodeId}`] = {
                    currentTime: currentTime,
                    duration: duration,
                    timestamp: Date.now()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            } catch (e) {
                console.error('Failed to save watch progress:', e);
            }
        }

        // Load watch progress from localStorage
        function loadWatchProgress(slug, episodeId) {
            try {
                const progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                const saved = progress[`${slug}_${episodeId}`];
                if (saved && saved.duration > 0) {
                    // Resume if not at the end (within last 2 minutes or 95%)
                    const threshold = Math.min(120, saved.duration * 0.05);
                    if (saved.currentTime < saved.duration - threshold) {
                        return saved.currentTime;
                    }
                }
            } catch (e) {
                console.error('Failed to load watch progress:', e);
            }
            return 0;
        }

        // Show resume notification
        function showResumeNotification(currentTime) {
            const minutes = Math.floor(currentTime / 60);
            const seconds = Math.floor(currentTime % 60);
            const timeStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // Create temporary notification
            const notification = document.createElement('div');
            notification.className = 'resume-notification';
            notification.innerHTML = `
                <div class="resume-content">
                    <span>▶ Tiếp tục xem từ ${timeStr}</span>
                </div>
            `;
            document.querySelector('.video-container')?.appendChild(notification);
            
            // Remove after 5 seconds
            setTimeout(() => {
                notification.remove();
            }, 5000);
        }

        // Video Player Variables
        let hls = null;
        let currentVideoUrl = null;

        // Open Modal with Video Player
        function openModal(videoUrl, movieName, slug, episodeId) {
            const modal = document.getElementById('modalOverlay');
            const video = document.getElementById('videoPlayer');
            const closeBtn = document.getElementById('modalClose');
            
            currentVideoUrl = videoUrl;
            currentMovieSlug = slug;
            currentEpisodeId = episodeId;
            modal.classList.add('active');
            
            // Setup video player with resume support
            setupVideoPlayer(videoUrl, movieName, slug, episodeId);
            
            // Focus close button initially
            setTimeout(() => closeBtn.focus(), 100);
        }

        // Setup Video Player with HLS support and resume playback
        function setupVideoPlayer(videoUrl, movieName, slug, episodeId) {
            const video = document.getElementById('videoPlayer');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const seekBackBtn = document.getElementById('seekBackBtn');
            const seekForwardBtn = document.getElementById('seekForwardBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const timeDisplay = document.getElementById('timeDisplay');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');
            
            // Load saved progress
            const savedTime = loadWatchProgress(slug, episodeId);
            
            // Reset video
            video.pause();
            video.currentTime = 0;
            
            // Setup HLS or native playback with resume support
            if (videoUrl.includes('.m3u8') && Hls.isSupported()) {
                // Destroy previous HLS instance
                if (hls) {
                    hls.destroy();
                }
                
                hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                    enableWorker: true
                });
                
                hls.loadSource(videoUrl);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    // Resume from saved position
                    if (savedTime > 0) {
                        video.currentTime = savedTime;
                        showResumeNotification(savedTime);
                    }
                    video.play().catch(() => {
                        // Auto-play blocked, user needs to press play
                    });
                    updatePlayPauseButton();
                });
                
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('HLS Error:', data);
                    }
                });
            } else {
                // Native playback for non-HLS
                video.src = videoUrl;
                video.load();
                // Resume from saved position
                if (savedTime > 0) {
                    video.currentTime = savedTime;
                    showResumeNotification(savedTime);
                }
                video.play().catch(() => {
                    // Auto-play blocked
                });
            }
            
            // Update time display
            function updateTimeDisplay() {
                const current = formatTime(video.currentTime);
                const duration = formatTime(video.duration || 0);
                timeDisplay.textContent = `${current} / ${duration}`;
                
                // Update progress bar
                const progress = video.duration ? (video.currentTime / video.duration) * 100 : 0;
                progressBar.style.width = `${progress}%`;
            }
            
            video.addEventListener('timeupdate', updateTimeDisplay);
            video.addEventListener('loadedmetadata', updateTimeDisplay);
            video.addEventListener('play', updatePlayPauseButton);
            video.addEventListener('pause', updatePlayPauseButton);
            
            // Save progress every 10 seconds
            const saveInterval = setInterval(() => {
                if (!video.paused && video.currentTime > 0 && slug && episodeId) {
                    saveWatchProgress(slug, episodeId, video.currentTime, video.duration || 0);
                }
            }, 10000);
            
            // Save on pause and beforeunload
            video.addEventListener('pause', () => {
                if (slug && episodeId) {
                    saveWatchProgress(slug, episodeId, video.currentTime, video.duration || 0);
                }
            });
            
            // Clean up interval on close
            const originalCloseModal = closeModal;
            closeModal = function() {
                clearInterval(saveInterval);
                // Final save before closing
                if (slug && episodeId && video.currentTime > 0) {
                    saveWatchProgress(slug, episodeId, video.currentTime, video.duration || 0);
                }
                originalCloseModal();
            };
            
            // Play/Pause
            function togglePlayPause() {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
                updatePlayPauseButton();
            }
            
            function updatePlayPauseButton() {
                playPauseBtn.textContent = video.paused ? '⏵ Play' : '⏸ Pause';
            }
            
            playPauseBtn.onclick = togglePlayPause;
            playPauseBtn.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    togglePlayPause();
                }
            };
            
            // Seek buttons
            function seek(seconds) {
                video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + seconds));
            }
            
            seekBackBtn.onclick = () => seek(-10);
            seekBackBtn.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    seek(-10);
                }
            };
            
            seekForwardBtn.onclick = () => seek(10);
            seekForwardBtn.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    seek(10);
                }
            };
            
            // Fullscreen
            fullscreenBtn.onclick = toggleFullscreen;
            fullscreenBtn.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    toggleFullscreen();
                }
            };
            
            function toggleFullscreen() {
                try {
                    if (!document.fullscreenElement) {
                        // Try video first, then modal container
                        if (video.requestFullscreen) {
                            video.requestFullscreen().catch(err => {
                                console.log('Video fullscreen failed, trying modal:', err);
                                modal.requestFullscreen?.();
                            });
                        } else if (modal.requestFullscreen) {
                            modal.requestFullscreen();
                        }
                    } else {
                        document.exitFullscreen?.();
                    }
                } catch (err) {
                    console.error('Fullscreen error:', err);
                }
            }
            
            // Progress bar click
            progressContainer.onclick = (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                video.currentTime = pos * video.duration;
            };
            
            // Auto-focus video after short delay for TV Box
            setTimeout(() => {
                video.focus();
            }, 500);
            
            // Keyboard controls for video
            video.onkeydown = (e) => {
                switch(e.key) {
                    case 'Escape':
                    case 'Backspace':
                        e.preventDefault();
                        closeModal();
                        break;
                    case 'Enter':
                    case ' ':
                        e.preventDefault();
                        togglePlayPause();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        seek(-10);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        seek(10);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        video.volume = Math.min(1, video.volume + 0.1);
                        showVolumeIndicator(video.volume);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        video.volume = Math.max(0, video.volume - 0.1);
                        showVolumeIndicator(video.volume);
                        break;
                    case 'f':
                    case 'F':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                }
            };
        }

        // Format time helper
        function formatTime(seconds) {
            if (isNaN(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Volume indicator
        let volumeTimeout = null;
        function showVolumeIndicator(volume) {
            const indicator = document.getElementById('volumeIndicator');
            const percentage = Math.round(volume * 100);
            indicator.textContent = `Âm lượng: ${percentage}%`;
            indicator.classList.add('show');
            
            clearTimeout(volumeTimeout);
            volumeTimeout = setTimeout(() => {
                indicator.classList.remove('show');
            }, 2000);
        }

        // Close Modal
        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            const video = document.getElementById('videoPlayer');
            
            // Stop video
            video.pause();
            video.src = '';
            
            // Destroy HLS instance
            if (hls) {
                hls.destroy();
                hls = null;
            }
            
            // Exit fullscreen if active
            if (document.fullscreenElement) {
                document.exitFullscreen?.();
            }
            
            modal.classList.remove('active');
            
            // Return focus to last focused movie
            const lastMovie = document.querySelector('.movie-item:focus') || 
                             document.querySelector(`[data-slug]`);
            if (lastMovie) {
                lastMovie.focus();
            }
        }

        // Setup Navigation
        function setupNavigation() {
            // Close button handler
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('modalClose').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') closeModal();
            });

            // Global keyboard handler
            document.addEventListener('keydown', handleKeyNavigation);
        }

        // Handle Keyboard Navigation
        function handleKeyNavigation(e) {
            const modal = document.getElementById('modalOverlay');
            
            // If modal is open - handle video controls
            if (modal.classList.contains('active')) {
                const video = document.getElementById('videoPlayer');
                const videoControls = document.querySelectorAll('.control-btn, .modal-close');
                const activeElement = document.activeElement;
                const currentIndex = Array.from(videoControls).indexOf(activeElement);
                
                // If video is focused, let video.onkeydown handle arrow keys
                if (activeElement === video) {
                    return;
                }
                
                switch(e.key) {
                    case 'Escape':
                    case 'Backspace':
                        e.preventDefault();
                        closeModal();
                        return;
                        
                    case 'Tab':
                        e.preventDefault();
                        // Cycle through controls
                        const nextIndex = (currentIndex + 1) % videoControls.length;
                        videoControls[nextIndex].focus();
                        return;
                        
                    case 'ArrowRight':
                        e.preventDefault();
                        if (currentIndex < videoControls.length - 1) {
                            videoControls[currentIndex + 1].focus();
                        }
                        return;
                        
                    case 'ArrowLeft':
                        e.preventDefault();
                        if (currentIndex > 0) {
                            videoControls[currentIndex - 1].focus();
                        }
                        return;
                        
                    case 'ArrowDown':
                        e.preventDefault();
                        // Focus video player to use video shortcuts
                        video.focus();
                        return;
                        
                    case 'Enter':
                        // Allow default button click behavior
                        return;
                }
                return;
            }

            // Main navigation when modal is closed
            const activeElement = document.activeElement;
            
            switch(e.key) {
                case 's':
                case 'S':
                    e.preventDefault();
                    document.getElementById('searchInput').focus();
                    break;
                    
                case 'ArrowRight':
                    e.preventDefault();
                    navigateHorizontal('right');
                    break;
                    
                case 'ArrowLeft':
                    e.preventDefault();
                    navigateHorizontal('left');
                    break;
                    
                case 'ArrowDown':
                    e.preventDefault();
                    navigateVertical('down');
                    break;
                    
                case 'ArrowUp':
                    e.preventDefault();
                    navigateVertical('up');
                    break;
                    
                case 'Enter':
                    if (activeElement.classList.contains('movie-item')) {
                        e.preventDefault();
                        playMovie(activeElement.dataset.slug);
                    }
                    break;
            }
        }

        // Navigate Horizontally (Left/Right)
        function navigateHorizontal(direction) {
            const activeElement = document.activeElement;
            const allFocusable = Array.from(document.querySelectorAll(focusableSelectors));
            const currentIndex = allFocusable.indexOf(activeElement);
            
            if (currentIndex === -1) {
                // No focus yet, focus first element
                const first = allFocusable[0];
                if (first) {
                    first.focus();
                    scrollIntoView(first);
                }
                return;
            }

            let nextElement = null;

            if (activeElement.classList.contains('movie-item')) {
                // Navigate within movie row
                const continueRow = document.getElementById('continueRow');
                const movieRow = document.getElementById('movieRow');
                
                // Determine which row the active element is in
                const currentRow = (continueRow && continueRow.contains(activeElement)) ? continueRow : movieRow;
                const movies = Array.from(currentRow.querySelectorAll('.movie-item'));
                const movieIndex = movies.indexOf(activeElement);
                
                if (direction === 'right' && movieIndex < movies.length - 1) {
                    nextElement = movies[movieIndex + 1];
                } else if (direction === 'right' && movieIndex === movies.length - 1) {
                    // At last movie, move to load more button (only for movieRow)
                    if (currentRow === movieRow) {
                        const loadMoreBtn = document.getElementById('loadMoreBtn');
                        if (loadMoreBtn) nextElement = loadMoreBtn;
                    }
                } else if (direction === 'left' && movieIndex > 0) {
                    nextElement = movies[movieIndex - 1];
                }
            } else if (activeElement.classList.contains('nav-item')) {
                // Navigate between nav items
                const navItems = Array.from(document.querySelectorAll('.nav-item'));
                const navIndex = navItems.indexOf(activeElement);
                
                if (direction === 'right' && navIndex < navItems.length - 1) {
                    nextElement = navItems[navIndex + 1];
                } else if (direction === 'left' && navIndex > 0) {
                    nextElement = navItems[navIndex - 1];
                } else if (direction === 'down') {
                    // Move to first movie
                    const firstMovie = document.querySelector('.movie-item');
                    if (firstMovie) nextElement = firstMovie;
                }
            }

            if (nextElement) {
                nextElement.focus();
                scrollIntoView(nextElement);
            }
        }

        // Navigate Vertically (Up/Down) - 2D Grid Navigation
        function navigateVertical(direction) {
            const activeElement = document.activeElement;
            
            let nextElement = null;

            if (activeElement.classList.contains('nav-item')) {
                if (direction === 'down') {
                    // Move to first movie
                    const firstMovie = document.querySelector('.movie-item');
                    if (firstMovie) nextElement = firstMovie;
                }
            } else if (activeElement.classList.contains('movie-item')) {
                const continueRow = document.getElementById('continueRow');
                const movieRow = document.getElementById('movieRow');
                const loadMoreBtn = document.getElementById('loadMoreBtn');
                
                // Get current column index
                const currentRow = continueRow && continueRow.contains(activeElement) ? continueRow : movieRow;
                const movies = Array.from(currentRow.querySelectorAll('.movie-item'));
                const currentIndex = movies.indexOf(activeElement);
                
                if (direction === 'up') {
                    // If in new movies section
                    if (movieRow && movieRow.contains(activeElement)) {
                        if (continueRow) {
                            const continueMovies = Array.from(continueRow.querySelectorAll('.movie-item'));
                            if (continueMovies.length > 0) {
                                // Try to find movie at same column index
                                if (currentIndex < continueMovies.length) {
                                    nextElement = continueMovies[currentIndex];
                                } else {
                                    // If continue row is shorter, focus last movie
                                    nextElement = continueMovies[continueMovies.length - 1];
                                }
                            } else {
                                // No continue watching movies, move to nav
                                const activeNav = document.querySelector('.nav-item.active') || document.querySelector('.nav-item');
                                if (activeNav) nextElement = activeNav;
                            }
                        } else {
                            // No continue watching section, move to nav
                            const activeNav = document.querySelector('.nav-item.active') || document.querySelector('.nav-item');
                            if (activeNav) nextElement = activeNav;
                        }
                    }
                    // If in continue watching section and at first movie, move to nav
                    else if (continueRow && continueRow.contains(activeElement)) {
                        if (currentIndex === 0) {
                            const activeNav = document.querySelector('.nav-item.active') || document.querySelector('.nav-item');
                            if (activeNav) nextElement = activeNav;
                        }
                    }
                } else if (direction === 'down') {
                    // If in continue watching section, move to new movies at same column
                    if (continueRow && continueRow.contains(activeElement) && movieRow) {
                        const newMovies = Array.from(movieRow.querySelectorAll('.movie-item'));
                        if (newMovies.length > 0) {
                            // Try to find movie at same column index
                            if (currentIndex < newMovies.length) {
                                nextElement = newMovies[currentIndex];
                            } else {
                                // If new movies row is shorter, focus last movie
                                nextElement = newMovies[newMovies.length - 1];
                            }
                        }
                    }
                    // If in new movies section, move to load more button
                    else if (movieRow && movieRow.contains(activeElement) && loadMoreBtn) {
                        nextElement = loadMoreBtn;
                    }
                }
            } else if (activeElement.id === 'loadMoreBtn') {
                const movieRow = document.getElementById('movieRow');
                if (direction === 'up' && movieRow) {
                    // Move to last movie in new movies section
                    const movies = Array.from(movieRow.querySelectorAll('.movie-item'));
                    if (movies.length > 0) nextElement = movies[movies.length - 1];
                }
            }

            if (nextElement) {
                nextElement.focus();
                scrollIntoView(nextElement);
            }
        }

        // Scroll element into view with offset for TV display
        function scrollIntoView(element) {
            if (element.classList.contains('movie-item')) {
                // Scroll horizontally within row
                const movieRow = document.getElementById('movieRow');
                const elementRect = element.getBoundingClientRect();
                const rowRect = movieRow.getBoundingClientRect();
                
                // Calculate scroll position to center the element
                const scrollLeft = element.offsetLeft - (rowRect.width / 2) + (element.offsetWidth / 2);
                
                movieRow.scrollTo({
                    left: scrollLeft,
                    behavior: 'smooth'
                });
                
                // Also ensure vertical visibility
                element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Prevent default scrolling with arrow keys
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                const modal = document.getElementById('modalOverlay');
                if (!modal.classList.contains('active')) {
                    e.preventDefault();
                }
            }
        }, { passive: false });
    </script>
